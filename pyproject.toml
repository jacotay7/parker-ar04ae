[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "parker-ar04ae"
version = "0.1.0"
description = "Serial control library for the Parker Hannifin ARIES AR-04AE servo drive"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[project.scripts]
aries = "parker_ar04ae.cli:main"

[tool.setuptools.packages.find]
include = ["parker_ar04ae*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
